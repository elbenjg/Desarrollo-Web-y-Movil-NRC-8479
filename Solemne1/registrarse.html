<!DOCTYPE html>
<html lang="es">
<head>
    <title>Heladería Frío Natural - Registrarse</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="estilos.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="d-flex flex-column min-vh-100">

    <header class="bg-deep-earth pb-2 pt-2">
        <div class="container">
            <div class="d-flex justify-content-end top-links mb-1" id="top-auth-links">
                <a href="registrarse.html" id="link-registrarse">Registrarse</a>
                <a href="iniciar_sesion.html" id="link-sesion">Iniciar sesion</a>
            </div>

            <div class="text-center">
                <a href="index.html" class="text-decoration-none"><h1 class="brand-logo mb-2">LOGO</h1></a>
            </div>

            <nav class="nav-links d-flex flex-wrap justify-content-center pb-2">
                <a href="sobre_nosotros.html">Sobre nosotros</a>
                <a href="carta.html">Carta y productos</a>
                <a href="index.html">Nombre de la heladeria</a>
                <a href="carrito.html">Carrito
                    <span class="badge rounded-pill badge-carrito" id="badge-carrito" style="display:none;">0</span>
                </a>
                <a href="locales.html">Locales</a>
                <a href="contacto.html">Contacto</a>
            </nav>
        </div>
    </header>

    <main class="container py-4 flex-grow-1">
        <h2 class="titulo-principal text-center fs-1 mb-4 mt-2">Crear una cuenta</h2>

        <form id="form-registro" class="mx-auto" style="max-width: 900px;" novalidate>
            <div class="mb-2">
                <input type="text" class="input-pill" id="input-nombre" placeholder="Ingrese su nombre completo">
                <div class="mensaje-error" id="error-nombre"></div>
            </div>
            <div class="mb-2">
                <input type="text" class="input-pill" id="input-run" placeholder="Ingrese su RUT/RUN (ej: 12.345.678-5)" maxlength="12">
                <div class="mensaje-error" id="error-run"></div>
            </div>
            <div class="mb-2">
                <input type="text" class="input-pill" id="input-direccion" placeholder="Ingrese su dirección (calle y número)">
                <div class="mensaje-error" id="error-direccion"></div>
            </div>
            <div class="mb-2">
                <input type="text" class="input-pill" id="input-comuna" placeholder="Ingrese su Comuna">
                <div class="mensaje-error" id="error-comuna"></div>
            </div>
            <div class="mb-2">
                <input type="text" class="input-pill" id="input-region" placeholder="Ingrese su Región">
                <div class="mensaje-error" id="error-region"></div>
            </div>
            <div class="mb-2">
                <input type="text" class="input-pill" id="input-provincia" placeholder="Ingrese su Provincia">
                <div class="mensaje-error" id="error-provincia"></div>
            </div>
            <div class="mb-2">
                <input type="date" class="input-pill" id="input-nacimiento" placeholder="Ingrese su Fecha de nacimiento">
                <div class="mensaje-error" id="error-nacimiento"></div>
            </div>
            <div class="mb-2">
                <select class="input-pill" id="input-sexo">
                    <option value="" selected disabled>Seleccione su sexo</option>
                    <option value="Femenino">Femenino</option>
                    <option value="Masculino">Masculino</option>
                    <option value="Prefiero no decirlo">Prefiero no decirlo</option>
                </select>
                <div class="mensaje-error" id="error-sexo"></div>
            </div>
            <div class="mb-2">
                <input type="email" class="input-pill" id="input-correo" placeholder="Ingrese su Correo">
                <div class="mensaje-error" id="error-correo"></div>
            </div>
            <div class="mb-2">
                <input type="tel" class="input-pill" id="input-telefono" placeholder="Ingrese su número telefónico (ej: +56 9 1234 5678)">
                <div class="mensaje-error" id="error-telefono"></div>
            </div>
            <div class="mb-2">
                <input type="password" class="input-pill" id="input-clave" placeholder="Cree una contraseña (mínimo 6 caracteres)">
                <div class="mensaje-error" id="error-clave"></div>
            </div>
            <div class="mb-3">
                <input type="password" class="input-pill" id="input-clave2" placeholder="Confirme su contraseña">
                <div class="mensaje-error" id="error-clave2"></div>
            </div>

            <div class="mensaje-error mb-3" id="error-general"></div>

            <div class="text-center">
                <button type="submit" class="btn-marca fs-5">Registrarme</button>
                <p class="mt-3">¿Ya tienes cuenta? <a href="iniciar_sesion.html">Inicia sesión aquí</a></p>
            </div>
        </form>
    </main>

    <footer class="bg-deep-earth pt-3 pb-3 mt-auto">
        <div class="container">
            <div class="row fw-bold fs-5 footer-text px-4">
                <div class="col-6 text-start"><a href="locales.html" class="footer-text">Horarios</a></div>
                <div class="col-6 text-end pe-5"><a href="contacto.html" class="footer-text">Contacto</a></div>
            </div>
            <hr class="footer-line">
            <div class="d-flex justify-content-between align-items-center px-4">
                <span class="footer-text fw-bold">@derechos reservados</span>
                <div class="d-flex gap-3">
                    <a href="#"><img src="https://static.vecteezy.com/system/resources/thumbnails/018/757/863/small/facebook-logo-facebook-icon-free-free-vector.jpg"
                        alt="Facebook" style="width: 30px; height: 30px;"></a>
                    <a href="#"><img src="https://thumbs.dreamstime.com/b/imagen-de-alta-resoluci%C3%B3n-del-icono-instagram-en-blanco-y-negro-para-uso-web-e-impresi%C3%B3n-logo-con-fondo-199614898.jpg"
                        alt="Instagram" style="width: 30px; height: 30px;"></a>
                    <a href="#"><img src="https://thumbs.dreamstime.com/b/icono-del-logo-de-twitter-en-blanco-y-negro-logotipo-alta-resoluci%C3%B3n-cuadrado-con-fondo-archivo-pasos-vectoriales-disponible-para-186846527.jpg" alt="Twitter" style="width: 30px; height: 30px;"></a>
                </div>
            </div>
        </div>
    </footer>

    <script src="productos.js"></script>
    <script src="utilidades.js"></script>
    <script src="carrito.js"></script>
    <script src="clientes.js"></script>
    <script src="boleta.js"></script>
    <script src="avisos.js"></script>
    <script src="render.js"></script>
    <script src="formularios.js"></script>
    <script src="main.js"></script>
</body>
</html>
