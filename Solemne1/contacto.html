<!DOCTYPE html>
<html lang="es">
<head>
    <title>Heladería Frío Natural - Contacto</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="estilos.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="d-flex flex-column min-vh-100">

    <header class="bg-deep-earth pb-2 pt-2">
        <div class="container">
            <div class="d-flex justify-content-end top-links mb-1" id="top-auth-links">
                <a href="registrarse.html" id="link-registrarse">Registrarse</a>
                <a href="iniciar_sesion.html" id="link-sesion">Iniciar sesion</a>
            </div>

            <div class="text-center">
                <a href="index.html" class="text-decoration-none"><h1 class="brand-logo mb-2">LOGO</h1></a>
            </div>

            <nav class="nav-links d-flex flex-wrap justify-content-center pb-2">
                <a href="sobre_nosotros.html">Sobre nosotros</a>
                <a href="carta.html">Carta y productos</a>
                <a href="index.html">Nombre de la heladeria</a>
                <a href="carrito.html">Carrito
                    <span class="badge rounded-pill badge-carrito" id="badge-carrito" style="display:none;">0</span>
                </a>
                <a href="locales.html">Locales</a>
                <a href="contacto.html" class="active">Contacto</a>
            </nav>
        </div>
    </header>

    <main class="container py-4 flex-grow-1">
        <h2 class="titulo-principal fs-1 mb-4 mt-3 text-center">Contacto</h2>

        <div class="row g-4">
            <div class="col-md-5">
                <div class="panel-caja h-100">
                    <h5 class="fw-bold mb-3">Escríbenos directamente</h5>
                    <p class="mb-1">📧 contacto@frionatural.cl</p>
                    <p class="mb-1">📞 +56 2 2345 6789</p>
                    <p class="mb-3">Horario de atención telefónica: 10:00 - 20:00 hrs</p>
                    <div class="d-flex gap-3">
                        <a href="#"><img src="https://static.vecteezy.com/system/resources/thumbnails/018/757/863/small/facebook-logo-facebook-icon-free-free-vector.jpg"
                            alt="Facebook" style="width: 30px; height: 30px;"></a>
                        <a href="#"><img src="https://thumbs.dreamstime.com/b/imagen-de-alta-resoluci%C3%B3n-del-icono-instagram-en-blanco-y-negro-para-uso-web-e-impresi%C3%B3n-logo-con-fondo-199614898.jpg"
                            alt="Instagram" style="width: 30px; height: 30px;"></a>
                        <a href="#"><img src="https://thumbs.dreamstime.com/b/icono-del-logo-de-twitter-en-blanco-y-negro-logotipo-alta-resoluci%C3%B3n-cuadrado-con-fondo-archivo-pasos-vectoriales-disponible-para-186846527.jpg" alt="Twitter" style="width: 30px; height: 30px;"></a>
                    </div>
                </div>
            </div>

            <div class="col-md-7">
                <form id="form-contacto" novalidate>
                    <div class="mb-2">
                        <input type="text" class="input-pill" id="input-contacto-nombre" placeholder="Ingrese su nombre" required>
                    </div>
                    <div class="mb-2">
                        <input type="email" class="input-pill" id="input-contacto-correo" placeholder="Ingrese su correo" required>
                    </div>
                    <div class="mb-2">
                        <input type="text" class="input-pill" id="input-contacto-asunto" placeholder="Asunto" required>
                    </div>
                    <div class="mb-3">
                        <textarea class="input-pill" id="input-contacto-mensaje" rows="4" placeholder="Escribe tu mensaje aquí" style="border-radius: 24px;" required></textarea>
                    </div>
                    <div class="text-center">
                        <button type="submit" class="btn-marca fs-5">Enviar mensaje</button>
                    </div>
                    <p class="text-center mt-3 d-none" id="confirmacion-contacto" style="color: var(--mocha); font-weight: 600;"></p>
                </form>
            </div>
        </div>
    </main>

    <footer class="bg-deep-earth pt-3 pb-3 mt-auto">
        <div class="container">
            <div class="row fw-bold fs-5 footer-text px-4">
                <div class="col-6 text-start"><a href="locales.html" class="footer-text">Horarios</a></div>
                <div class="col-6 text-end pe-5"><a href="contacto.html" class="footer-text">Contacto</a></div>
            </div>
            <hr class="footer-line">
            <div class="d-flex justify-content-between align-items-center px-4">
                <span class="footer-text fw-bold">@derechos reservados</span>
                <div class="d-flex gap-3">
                    <a href="#"><img src="https://static.vecteezy.com/system/resources/thumbnails/018/757/863/small/facebook-logo-facebook-icon-free-free-vector.jpg"
                        alt="Facebook" style="width: 30px; height: 30px;"></a>
                    <a href="#"><img src="https://thumbs.dreamstime.com/b/imagen-de-alta-resoluci%C3%B3n-del-icono-instagram-en-blanco-y-negro-para-uso-web-e-impresi%C3%B3n-logo-con-fondo-199614898.jpg"
                        alt="Instagram" style="width: 30px; height: 30px;"></a>
                    <a href="#"><img src="https://thumbs.dreamstime.com/b/icono-del-logo-de-twitter-en-blanco-y-negro-logotipo-alta-resoluci%C3%B3n-cuadrado-con-fondo-archivo-pasos-vectoriales-disponible-para-186846527.jpg" alt="Twitter" style="width: 30px; height: 30px;"></a>
                </div>
            </div>
        </div>
    </footer>

    <script src="productos.js"></script>
    <script src="utilidades.js"></script>
    <script src="carrito.js"></script>
    <script src="clientes.js"></script>
    <script src="boleta.js"></script>
    <script src="avisos.js"></script>
    <script src="render.js"></script>
    <script src="formularios.js"></script>
    <script src="main.js"></script>
</body>
</html>
